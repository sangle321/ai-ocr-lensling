name: lensling
description: Private, on-device photo OCR and translation.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  paddle_ocr_native: 0.1.1
  image_picker: ^1.2.1
  image: ^4.12.0
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/google_translate.png
